<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="45" fill="#1a1612" stroke="#c9a456" stroke-width="3"/>
  <circle cx="50" cy="50" r="40" fill="#f5f0e6"/>

  <!-- Hour markers -->
  <g stroke="#1a1612" stroke-width="2">
    <line x1="50" y1="15" x2="50" y2="20"/>
    <line x1="50" y1="80" x2="50" y2="85"/>
    <line x1="15" y1="50" x2="20" y2="50"/>
    <line x1="80" y1="50" x2="85" y2="50"/>
  </g>

  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#1a1612" stroke-width="4" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="50" y1="50" x2="70" y2="50" stroke="#1a1612" stroke-width="3" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#c9a456"/>
</svg>
